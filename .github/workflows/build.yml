name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # project.pbxproj is generated by genproj.py and must never be
      # hand-edited; fail if the committed file is stale.
      - name: Check project.pbxproj is up to date
        run: |
          python3 genproj.py
          if ! git diff --quiet -- ZenTime.xcodeproj/project.pbxproj; then
            echo "::error::project.pbxproj is out of date. Run 'python3 genproj.py' and commit the result."
            git diff -- ZenTime.xcodeproj/project.pbxproj
            exit 1
          fi

      - name: Build (Debug)
        run: |
          xcodebuild -project ZenTime.xcodeproj -scheme ZenTime \
            -configuration Debug -destination 'platform=macOS' build

      - name: Build (Release)
        run: |
          xcodebuild -project ZenTime.xcodeproj -scheme ZenTime \
            -configuration Release -derivedDataPath build \
            -destination 'platform=macOS' build
